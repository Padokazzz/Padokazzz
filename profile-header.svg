<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo Padilha — Software Engineering Archive</title>
  <desc id="desc">A dark analog-inspired technical archive banner with muted phosphor green and amber details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d0c"/>
      <stop offset=".55" stop-color="#111816"/>
      <stop offset="1" stop-color="#17120f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="55%">
      <stop offset="0" stop-color="#9b6b37" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9b6b37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b5a5" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#dce6d8" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>
  <path d="M48 42H1152M48 318H1152" stroke="#9baf9b" stroke-opacity=".32"/>
  <path d="M48 42V58M1152 42V58M48 302V318M1152 302V318" stroke="#b28a58" stroke-width="2"/>
  <g fill="#9aa89b" font-family="monospace" font-size="12" letter-spacing="2">
    <text x="64" y="76">PERSONAL ARCHIVE / 001</text>
    <text x="1136" y="76" text-anchor="end">SOFTWARE ENGINEERING</text>
    <text x="64" y="292">FIELD NOTES · SYSTEMS · INTERFACES</text>
    <text x="1136" y="292" text-anchor="end">BRAZIL / ONLINE</text>
  </g>
  <g transform="translate(64 112)">
    <rect x="0" y="0" width="5" height="112" fill="#a8b78d"/>
    <text x="28" y="45" fill="#e2e7dc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="1">LEONARDO PADILHA</text>
    <text x="30" y="82" fill="#b28a58" font-family="monospace" font-size="17" letter-spacing="3">FULL STACK DEVELOPER</text>
    <text x="30" y="111" fill="#9aa89b" font-family="monospace" font-size="13" letter-spacing="1.4">C# / .NET  ·  TYPESCRIPT  ·  REACT  ·  PYTHON</text>
  </g>
  <g transform="translate(1010 136)" opacity=".82">
