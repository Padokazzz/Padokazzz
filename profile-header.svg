    <circle cx="0" cy="0" r="48" fill="none" stroke="#b28a58" stroke-opacity=".42" stroke-dasharray="2 7"/>
    <path d="M-30 0H30M0-30V30M-21-21L21 21M21-21L-21 21" stroke="#a8b78d" stroke-opacity=".42"/>
    <circle cx="0" cy="0" r="8" fill="#b28a58"/>
    <circle cx="0" cy="0" r="3" fill="#111816"/>
  </g>
  <g fill="#b28a58">
